<!-- sample rectangle -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Main cab body (sharper rounded front, scaled up) -->
  <rect x="7" y="15" width="44" height="33" rx="10" fill="#1E1E1E"/>
  
  <!-- Destination strip (bolder, with glow - scaled) -->
  <rect x="10" y="14" width="36" height="8" rx="5" fill="#C2410C"/>
  <rect x="11" y="15" width="34" height="6" rx="4" fill="#D97706"/>
  
  <!-- Windshield (rectangle version you kept, scaled) -->
  <rect x="15" y="26" width="28" height="12" rx="6" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  
  <!-- Dual headlights (classic train look, scaled) -->
  <circle cx="46" cy="21" r="3" fill="#F9D65D" opacity="0.9"/>
  <circle cx="46" cy="21" r="1.4" fill="#FFFFFF"/>
  <circle cx="52" cy="24" r="1.8" fill="#F9D65D" opacity="0.7"/>
  
   <!-- Chassis/underbody (train authenticity, scaled) -->
  <rect x="12" y="44" width="32" height="5" rx="2.4" fill="#151515"/>
  <circle cx="20" cy="48" r="4.3" fill="#dfe1e5ff" stroke="#333" stroke-width="1"/>
  <circle cx="36" cy="48" r="4.3" fill="#dfe1e5ff" stroke="#333" stroke-width="1"/>
  <!-- Wheel rims for extra definition -->
  <circle cx="20" cy="48" r="3.2" fill="#2A2A2A"/>
  <circle cx="36" cy="48" r="3.2" fill="#2A2A2A"/>
</svg>
