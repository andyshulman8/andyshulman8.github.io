<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Second car (left body section) -->
  <rect x="5" y="28" width="28" height="20" rx="3" fill="#3B3B3B" stroke="#E5E7EB" stroke-width="1"/>
  <!-- Second car window -->
  <rect x="12" y="34" width="8" height="10" fill="#505050" rx="1"/>
  
  <!-- Main cab body (rounded front, sits ON chassis) -->
  <path fill="#3B3B3B" stroke="#E5E7EB" stroke-width="1.5" stroke-linejoin="round"
        d="M 33 28 H53 A10 10 0 0 1 60 38 A10 10 0 0 1 53 48 H33 V28 Z"/>
  
  <!-- Orange destination strip -->
  <rect x="36" y="29" width="22" height="5" rx="2.5" fill="#C2410C"/>
  
  <!-- Tinted windshield -->
  <rect x="39" y="37" width="16" height="8" rx="3" 
        fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
  
  <!-- Dual headlights -->
  <circle cx="59" cy="36" r="2.2" fill="#F9D65D" opacity="0.9"/>
  <circle cx="59" cy="36" r="1" fill="#FFFFFF"/>
  <!-- <circle cx="60" cy="39" r="1.5" fill="#F9D65D" opacity="0.7"/> -->
  
  <!-- Chassis (both cars sit directly on top) -->
  <rect x="5" y="48" width="50" height="3" rx="1.5" fill="#151515"/>
  
  <!-- Wheels (properly grounded below chassis) -->
  <!-- Second car wheels -->
  <circle cx="16" cy="55" r="3" fill="#4B4B4B" stroke="#DFE1E5" stroke-width="0.8"/>
  <circle cx="16" cy="55" r="1.3" fill="#2A2A2A"/>
  <circle cx="26" cy="55" r="3" fill="#4B4B4B" stroke="#DFE1E5" stroke-width="0.8"/>
  <circle cx="26" cy="55" r="1.3" fill="#2A2A2A"/>
  <!-- Cab wheels -->
  <circle cx="42" cy="55" r="3" fill="#4B4B4B" stroke="#DFE1E5" stroke-width="0.8"/>
  <circle cx="42" cy="55" r="1.3" fill="#2A2A2A"/>
  <circle cx="52" cy="55" r="3" fill="#4B4B4B" stroke="#DFE1E5" stroke-width="0.8"/>
  <circle cx="52" cy="55" r="1.3" fill="#2A2A2A"/>
</svg>
